name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Determinism gate (two peers, lag, rollback, hash compare)
        run: node scripts/ci-determinism.mjs
